[project]
name = "tasktracker-backend"
version = "0.1.0"
description = "Modular self-hosted platform for team work management."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session: the module-level engine and its
# connection pool are shared with the app, so tests must not hop between loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:app.*"]
# A blocked database lock once stalled the suite indefinitely: one transaction
# waited for a row another was still inserting, and neither side was visible to
# the deadlock detector. A hang must fail the run instead of filling the CI log
# with nothing.
timeout = 90

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
# Autogenerated migrations are machine written and reviewed by hand.
"alembic/versions/*" = ["E501"]
# Domain exceptions are named after the invalid thing, not the "Error" suffix.
"app/core/events/types.py" = ["N818"]
"app/core/modules/manifest.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false