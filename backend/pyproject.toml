[project]
name = "tasktracker-backend"
version = "0.1.0"
description = "Modular self-hosted platform for team work management."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
# Domain exceptions are named after the invalid thing, not the "Error" suffix.
"app/core/events/types.py" = ["N818"]
"app/core/modules/manifest.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false