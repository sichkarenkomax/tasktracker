name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tasktracker
          POSTGRES_PASSWORD: tasktracker
          POSTGRES_DB: tasktracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasktracker -d tasktracker_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tasktracker:tasktracker@localhost:5432/tasktracker_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      # scripts/ lives outside the backend package but ships with the product:
      # e2e.py is the acceptance harness and wait_for.py is what the quick start
      # tells newcomers to run, so neither may rot unnoticed.
      - name: Lint and type check (scripts)
        run: |
          ruff check ../scripts --config pyproject.toml
          ruff format --check ../scripts --config pyproject.toml
          mypy ../scripts --config-file pyproject.toml

      - name: Tests (pytest)
        run: pytest -q

      - name: Migrations apply cleanly from scratch
        env:
          DATABASE_URL: postgresql+asyncpg://tasktracker:tasktracker@localhost:5432/tasktracker_migrations
        run: |
          psql "postgresql://tasktracker:tasktracker@localhost:5432/postgres" \
            -c "CREATE DATABASE tasktracker_migrations"
          alembic upgrade head
          alembic downgrade base

      - name: Models and migrations agree
        env:
          DATABASE_URL: postgresql+asyncpg://tasktracker:tasktracker@localhost:5432/tasktracker_migrations
        # Fails when a model changed without a matching migration, which is
        # otherwise only discovered in production.
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Validate docker-compose.test.yml
        run: docker compose -f docker-compose.test.yml config --quiet

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max