<!doctype html>
<html lang="en" data-theme="gold">
  <head>
    <meta charset="UTF-8" />
    <!-- Runs before the stylesheet is applied, so the first paint is already
         the stored theme instead of a flash of the default one. Gold is the
         default (stage 1.1); the choice itself is made on the profile page. -->
    <script>
      try {
        var storedTheme = localStorage.getItem('tasktracker.theme')
        document.documentElement.dataset.theme =
          storedTheme === 'blue' ? 'blue' : 'gold'
      } catch (error) {
        document.documentElement.dataset.theme = 'gold'
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Self-hosted platform for managing team work." />
    <!-- Every page requires a session, so there is nothing here for a crawler to
         read and no reason to let one cache a stale copy of the shell. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>TaskTracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
