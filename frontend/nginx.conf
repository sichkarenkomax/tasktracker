server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it names the hashed asset bundles, so a
    # stale copy points the browser at files the server no longer has.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Everything behind this host needs a session, so there is nothing worth
    # indexing. Serving the rule explicitly beats leaving a 200 on a missing
    # robots.txt, which a crawler treats as "index everything here".
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}